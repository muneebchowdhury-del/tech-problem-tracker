name: Weekly scrape

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional: override the default model without editing code.
          # GROQ_MODEL: openai/gpt-oss-120b
        run: python scraper/run.py

      - name: Commit updated findings
        run: |
          git config user.name "tech-problem-tracker-bot"
          git config user.email "actions@github.com"
          git add data/findings.json docs/findings.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Weekly scrape: update findings"
          git push
